<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduled Maintenance | DiginixIT</title>
    <meta name="description" content="DiginixIT is undergoing scheduled maintenance to upgrade our systems. We will be back online shortly.">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- DNS Prefetch & Preconnect -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <meta name="color-scheme" content="light">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        canvas: '#ffffff',
                        'canvas-soft': '#fafafa',
                        'canvas-night': '#1c1c1c',
                        ink: '#171717',
                        'ink-secondary': '#212121',
                        'ink-mute': '#707070',
                        'ink-faint': '#b2b2b2',
                        primary: '#3ecf8e',
                        'primary-deep': '#24b47e',
                        hairline: '#dfdfdf',
                        'hairline-strong': '#c7c7c7',
                        'hairline-cool': '#ededed'
                    },
                    letterSpacing: { 
                        tighter: '-0.04em', 
                        tight: '-0.02em',
                        display: '-0.03em'
                    }
                }
            }
        };
    </script>

    <!-- Core Libraries -->
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        @keyframes slow-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .rotate-slow {
            animation: slow-rotate 12s linear infinite;
        }
        .dot-ping {
            animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
    </style>
    <script src="https://pl29723698.effectivecpmnetwork.com/f5/fa/b6/f5fab6e8cc06a0f1d99f2c7a62ee699c.js"></script>
</head>
<body class="bg-canvas text-ink min-h-screen flex flex-col justify-between overflow-x-hidden">

    <div class="noise"></div>

    <!-- Header Logo -->
    <header class="py-6 px-6 md:px-12 z-20">
        <div class="max-w-[1280px] mx-auto flex justify-start items-center">
            <span class="text-xl font-medium tracking-tighter text-ink site-logo-text" style="letter-spacing: -0.04em;">DIGINIXIT.</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-6 py-6 md:py-12 relative">
        <!-- Massive Background Text (Like 404 page) -->
        <div class="select-none pointer-events-none absolute inset-0 flex items-center justify-center z-0 overflow-hidden" aria-hidden="true">
            <span id="bg-text" style="font-size: clamp(4rem, 20vw, 16rem); font-weight: 800; letter-spacing: -8px; color: #ededed; line-height: 1;">OFFLINE</span>
        </div>

        <!-- Centered Text Block -->
        <div class="max-w-xl w-full text-center relative z-10 space-y-6">
            
            <!-- Badge -->
            <div id="status-badge" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-canvas-soft border border-hairline-cool">
                <span class="relative flex h-2 w-2">
                    <span class="dot-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
                </span>
                <span class="text-[10px] uppercase font-semibold tracking-wider text-ink-mute">Undergoing Scheduled Upgrades</span>
            </div>

            <!-- Icon Container -->
            <div id="icon-container" class="w-16 h-16 bg-canvas-soft border border-hairline rounded-xl flex items-center justify-center mx-auto">
                <i data-lucide="settings" class="w-8 h-8 text-ink-secondary"></i>
            </div>

            <!-- Headline -->
            <h1 id="maint-title" class="text-3xl md:text-5xl font-medium tracking-display text-ink" style="letter-spacing: -1.44px;">Scheduled Maintenance</h1>
            
            <p id="maint-desc" class="text-base md:text-lg text-ink-mute leading-relaxed max-w-md mx-auto">
                We are currently optimizing our systems to serve you better. We'll be back online shortly. Thank you for your patience.
            </p>

            <!-- Line Divider -->
            <div id="divider-line" class="h-px bg-hairline-cool w-32 mx-auto"></div>

            <!-- Contact Box (Horizontal cards) -->
            <div id="contact-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-md mx-auto pt-2">
                <div class="flex items-center gap-3 p-3 bg-white border border-hairline rounded-lg hover:bg-canvas-soft hover:border-hairline-strong transition-all duration-200">
                    <div class="w-8 h-8 rounded-md bg-canvas-soft border border-hairline-cool flex items-center justify-center flex-shrink-0">
                        <i data-lucide="mail" class="w-4 h-4 text-ink-mute"></i>
                    </div>
                    <div class="min-w-0 flex-1 text-left">
                        <p class="text-[9px] text-ink-faint uppercase font-bold tracking-wider">Email</p>
                        <a href="mailto:contact@diginixit.com" id="maintenance-email" class="text-xs font-semibold text-ink hover:text-primary transition-colors truncate block">contact@diginixit.com</a>
                    </div>
                </div>

                <div class="flex items-center gap-3 p-3 bg-white border border-hairline rounded-lg hover:bg-canvas-soft hover:border-hairline-strong transition-all duration-200">
                    <div class="w-8 h-8 rounded-md bg-canvas-soft border border-hairline-cool flex items-center justify-center flex-shrink-0">
                        <i data-lucide="phone" class="w-4 h-4 text-ink-mute"></i>
                    </div>
                    <div class="min-w-0 flex-1 text-left">
                        <p class="text-[9px] text-ink-faint uppercase font-bold tracking-wider">Phone</p>
                        <a href="tel:+923007960300" id="maintenance-phone" class="text-xs font-semibold text-ink hover:text-primary transition-colors truncate block">+92 300 7960300</a>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 px-6 border-t border-hairline z-20">
        <div class="max-w-[1280px] mx-auto flex flex-col md:flex-row justify-between items-center text-xs text-ink-mute gap-y-2 md:gap-y-0">
            <div>&copy; 2026 DiginixIT. All rights reserved.</div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/common.js" defer></script>
    <script>
        // GSAP Animations on DOMContentLoaded
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof gsap !== 'undefined') {
                const tl = gsap.timeline({ defaults: { ease: 'power3.out', duration: 1 } });
                
                // Set initial hidden states to avoid flash of content
                gsap.set('#bg-text', { opacity: 0, scale: 0.9 });
                gsap.set(['#status-badge', '#icon-container', '#maint-title', '#maint-desc', '#divider-line', '#contact-container'], { opacity: 0, y: 15 });

                tl.to('#bg-text', { opacity: 1, scale: 1, duration: 1.4 })
                  .to('#status-badge', { opacity: 1, y: 0, duration: 0.6 }, '-=0.8')
                  .to('#icon-container', { opacity: 1, y: 0, duration: 0.6 }, '-=0.5')
                  .to('#maint-title', { opacity: 1, y: 0, duration: 0.6 }, '-=0.5')
                  .to('#maint-desc', { opacity: 1, y: 0, duration: 0.6 }, '-=0.5')
                  .to('#divider-line', { opacity: 1, duration: 0.4 }, '-=0.4')
                  .to('#contact-container', { opacity: 1, y: 0, duration: 0.6 }, '-=0.3');
            }
        });
    </script>
</body>
</html>
