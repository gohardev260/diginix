        }

        #article-content p {

            line-height: 1.2;

        }

        #article-content h1 {

        }

        #article-content a:hover {

        }

        /* Restore standard native HTML list styling on the article page */

        }
        #article-content ol {

            padding-left: 1.5rem !important;
            margin-bottom: 1.75rem;
        }
        #article-content ul li,

            list-style-type: disc !important;
        }
        #article-content ol li,
        #article-content li[data-list="ordered"] {

        }

            margin-bottom: 0.5rem;
        }

            display: none !important;

        }

        }

        #article-content pre,

            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

        }

        #article-content pre {
            padding: 1rem;
            overflow-x: auto;
            margin-bottom: 1.75rem;
            background-color: var(--color-canvas-night);
            color: var(--color-on-dark);
            border-radius: var(--radius-sm);
            max-width: 100%;
            white-space: pre-wrap;
        }

        #article-content pre code {
            background-color: transparent;
            padding: 0;
            font-size: 0.9em;
            color: inherit;
            white-space: pre-wrap;
        }

        /* ── Diagram / ASCII Art Block ────────────────────────────── */
        /* pre.ql-diagram is inserted by the admin Diagram button.           */
        /* It preserves every character exactly (white-space: pre) so ASCII  */
        /* art renders perfectly without collapsing spaces.                   */
        #article-content pre.ql-diagram {
            display: block;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace;
            background-color: #111111;
            color: #d4d4d4;
            padding: 1.5rem 1.75rem;
            border-radius: 10px;
            /* ── Scroll behaviour ── */
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            /* smooth momentum scroll on iOS */
            max-width: 100%;
            /* never exceed the article column */
            box-sizing: border-box;
            /* ── Preserve exact whitespace ── */
            white-space: pre;
            word-break: normal;
            overflow-wrap: normal;
            /* ── Typography ── */
            font-size: 0.85rem;
            line-height: 1.65;
            margin-bottom: 1.75rem;
            border-left: 3px solid #3ecf8e;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
        }

        /* Show a subtle scrollbar so users know they can scroll sideways */
        #article-content pre.ql-diagram::-webkit-scrollbar {
            height: 5px;
        }

        #article-content pre.ql-diagram::-webkit-scrollbar-track {
            background: #1e1e1e;
            border-radius: 0 0 8px 8px;
        }

        #article-content pre.ql-diagram::-webkit-scrollbar-thumb {
            background: #3ecf8e55;
            border-radius: 4px;
        }

        #article-content pre.ql-diagram::-webkit-scrollbar-thumb:hover {
            background: #3ecf8e99;
        }

        /* On small screens: tighter padding + smaller font, still scrollable */
        @media (max-width: 640px) {
            #article-content pre.ql-diagram {
                font-size: 0.7rem;
                line-height: 1.55;
                padding: 0.875rem 1rem;
                border-radius: 7px;
                /* Negative margin trick lets the block use the full viewport width
                   while the article column stays narrow — gives more room to scroll */
                margin-left: -1rem;
                margin-right: -1rem;
                max-width: calc(100% + 2rem);
                border-radius: 0;
                border-left-width: 3px;
            }
        }


        /* ── Article Metadata Bar — 3-Column Grid ────────────────────── */
        /*
         *  Col 1 (avatar-col):  fixed ~36px  — avatar icon, spans 2 rows
         *  Col 2 (info-col):    flex grow     — row1: author name, row2: date
         *  Col 3 (action-col):  auto          — row1: read time, row2: icons
         */
        .article-meta-bar {
            display: grid;
            grid-template-columns: 36px 1fr auto;
            grid-template-rows: auto auto;
            column-gap: 0.65rem;
            row-gap: 0.3rem;
            align-items: center;
            border-bottom: 1px solid #dfdfdf;
            padding-bottom: 1.25rem;
            margin-bottom: 2rem;
        }

        /* Avatar — spans both rows in col 1 */
        .meta-avatar {
            grid-column: 1;
            grid-row: 1 / 3;
            align-self: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #fafafa;
            border: 1px solid #dfdfdf;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            font-size: 0.7rem;
            color: #171717;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        /* Author name — col2, row1 */
        .meta-author {
            grid-column: 2;
            grid-row: 1;
            font-weight: 500;
            font-size: 0.875rem;
            color: #171717;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Date — col2, row2; sits directly under author (not avatar) */
        .meta-date {
            grid-column: 2;
            grid-row: 2;
            font-size: 0.8rem;
            color: #707070;
            white-space: nowrap;
        }

        /* Read time — col3, row1; right-aligned, matches author size */
        .meta-read-time {
            grid-column: 3;
            grid-row: 1;
            font-size: 0.8rem;
            color: #707070;
            white-space: nowrap;
            text-align: right;
        }

        /* Share icons — col3, row2; right-aligned */
        .share-toolbar {
            grid-column: 3;
            grid-row: 2;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.35rem;
        }

        .share-icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.875rem;
            height: 1.875rem;
            border-radius: 6px;
            border: 1px solid #dfdfdf;
            color: #707070;
            background: transparent;
            text-decoration: none;
            transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;

        .share-icon-btn:hover {
            border-color: #171717;
            color: #171717;
            background: #fafafa;

        .share-icon-btn svg {

        /* ── Responsive ─────────────────────────────────────────────── */

                column-gap: 0.5rem;
            }

                width: 32px;
                height: 32px;

        function formatLocalShortDate(dateStr) {
            if (!dateStr) return 'N/A';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return String(dateStr).substring(0, 10);
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            } catch (e) {
                return String(dateStr).substring(0, 10);
            }
        }

        async function loadArticleDetail() {
            const params = new URLSearchParams(window.location.search);
            const articleId = params.get('id');

            if (!articleId) {
                renderNotFound("No article ID was provided.");
                return;
            }

            await window.backendReady;
            const blogs = await window.apiCall('get_blogs') || [];
            const post = blogs.find(b => String(b.id) === String(articleId));

            if (!post) {
                renderNotFound("The requested article could not be found.");
                return;
            }

            // Set Title & Meta tags dynamically for SEO & Social Cards
            const currentUrl = `https://diginixit.com/article.html?id=${post.id}`;
            const postImage = 'https://diginixit.com/images/og-home.jpg';

            document.title = `${post.title} | DiginixIT`;

            const metaTitle = document.getElementById('meta-title-tag');
            if (metaTitle) metaTitle.innerText = `${post.title} | DiginixIT`;

            const metaDesc = document.getElementById('meta-desc-tag');
            if (metaDesc) metaDesc.content = post.summary;

            const canonical = document.getElementById('canonical-link');
            if (canonical) canonical.href = currentUrl;

            // Open Graph Override
            const ogUrl = document.getElementById('og-url-tag');
            if (ogUrl) ogUrl.content = currentUrl;
            const ogTitle = document.getElementById('og-title-tag');
            if (ogTitle) ogTitle.content = `${post.title} | DiginixIT`;
            const ogDesc = document.getElementById('og-desc-tag');
            if (ogDesc) ogDesc.content = post.summary;
            const ogImage = document.getElementById('og-image-tag');
            if (ogImage) ogImage.content = postImage;

            // Twitter Card Override
            const twitterUrl = document.getElementById('twitter-url-tag');
            if (twitterUrl) twitterUrl.content = currentUrl;
            const twitterTitle = document.getElementById('twitter-title-tag');
            if (twitterTitle) twitterTitle.content = `${post.title} | DiginixIT`;
            const twitterDesc = document.getElementById('twitter-desc-tag');
            if (twitterDesc) twitterDesc.content = post.summary;
            const twitterImage = document.getElementById('twitter-image-tag');
            if (twitterImage) twitterImage.content = postImage;

            // Inject Dynamic JSON-LD Article Schema
            try {
                const schema = {
                    "@context": "https://schema.org",
                    "@type": "Article",
                    "headline": post.title,
                    "description": post.summary,
                    "image": [postImage],
                    "datePublished": post.date,
                    "dateModified": post.date,
                    "author": [{
                        "@type": "Person",
                        "name": post.author || "DiginixIT Staff",
                        "url": "https://diginixit.com/blog.html"
                    }],
                    "publisher": {
                        "@type": "Organization",
                        "name": "DiginixIT",
                        "logo": {
                            "@type": "ImageObject",
                            "url": "https://diginixit.com/favicon.svg"
                        }
                    },
                    "url": currentUrl,
                    "mainEntityOfPage": currentUrl
                };
                const schemaScript = document.createElement('script');
                schemaScript.type = 'application/ld+json';
                schemaScript.text = JSON.stringify(schema);
                document.head.appendChild(schemaScript);
            } catch (e) {
                console.error("Failed to inject article schema:", e);
            }

            const titleEl = document.getElementById('article-title');
            if (titleEl) titleEl.innerText = post.title;

            // Set Categories
            const breadcrumbEl = document.getElementById('article-category-breadcrumb');
            if (breadcrumbEl) breadcrumbEl.innerText = post.category;

            // Date & Author details
            const dateEl = document.getElementById('article-date');
            if (dateEl) dateEl.innerText = formatLocalShortDate(post.date);

            const authorEl = document.getElementById('article-author');
            if (authorEl) authorEl.innerText = post.author;

            // Author initials
            if (post.author) {
                const initials = post.author.split(' ').map(name => name[0]).join('').substring(0, 2).toUpperCase();
                const initialsEl = document.getElementById('author-initials');
                if (initialsEl) initialsEl.innerText = initials;
            }

            // Calculate Reading Time (avg 200 words per minute)
            const words = post.content ? post.content.split(/\s+/).length : 0;
            const readingTime = Math.max(1, Math.ceil(words / 200));
            const readTimeEl = document.getElementById('article-readtime');
            if (readTimeEl) readTimeEl.innerText = `${readingTime} min read`;

            // Render rich content or paragraphs
            const contentsContainer = document.getElementById('article-content');
            if (post.content && contentsContainer) {
                const hasHtml = /<[a-z][\s\S]*>/i.test(post.content);
                if (hasHtml) {
                    contentsContainer.innerHTML = DOMPurify.sanitize(post.content, {
                        ALLOWED_TAGS: ['p', 'br', 'strong', 'em', 's', 'strike', 'h1', 'h2', 'h3', 'ul', 'ol', 'li', 'a', 'code', 'pre', 'span', 'blockquote'],
                        ALLOWED_ATTR: ['href', 'target', 'rel', 'style', 'class', 'start'],
                        FORCE_HTTPS: true
                    });
                } else {
                    const paragraphs = post.content.split('\n\n');
                    contentsContainer.innerHTML = paragraphs.map((p) => {
                        const cleanP = DOMPurify.sanitize(p, {
                            ALLOWED_TAGS: ['p', 'br', 'strong', 'em', 'h2', 'h3', 'ul', 'ol', 'li', 'a', 'code', 'pre'],
                            ALLOWED_ATTR: ['href', 'target', 'rel', 'start'],
                            FORCE_HTTPS: true
                        });
                        return `<p>${cleanP}</p>`;
                    }).join('');
                }


                // ── Post-render diagram fix ─────────────────────────────────
                // Quill sometimes stores newlines inside <pre.ql-diagram> as <br>
                // tags (old storage) or collapses spaces. We rebuild each diagram
                // block from its innerText (which preserves \n and spaces correctly)
                // and set it as textContent so CSS white-space:pre renders it perfectly.
                contentsContainer.querySelectorAll('pre.ql-diagram').forEach(pre => {
                    // innerText respects <br> → \n and preserved whitespace nodes
                    const rawText = pre.innerText;
                    // Re-set as textContent (no HTML parsing, spaces/newlines kept)
                    pre.textContent = rawText;
                });

                // ── Post-render list starting number alignment ──────────────
                // Automatically calculates sequential numbering for all separate <ol> lists
                // that are part of the same section (split by paragraphs or bullets, but reset on headings/hr)
                const allElements = Array.from(contentsContainer.querySelectorAll('ol, h1, h2, h3, hr'));
                let currentCounter = 1;

                allElements.forEach((el) => {
                    const tagName = el.tagName;
                    if (tagName === 'H1' || tagName === 'H2' || tagName === 'H3' || tagName === 'HR') {
                        // Reset counter to 1 when entering a new section heading
                        currentCounter = 1;
                    } else if (tagName === 'OL') {
                        // Set start attribute natively based on current counter
                        el.setAttribute('start', currentCounter);
                        const numItems = el.querySelectorAll('li').length;
                        currentCounter += numItems;
                    }
                });



            } else if (contentsContainer) {
                contentsContainer.innerHTML = `<p class="italic text-ink-mute">No content available for this article.</p>`;
            }

            // Initialize Share Toolbar links
            const shareUrl = window.location.href;
            const shareTwitter = document.getElementById('share-twitter');
            if (shareTwitter) shareTwitter.href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(post.title)}&url=${encodeURIComponent(shareUrl)}`;

            const shareLinkedin = document.getElementById('share-linkedin');
            if (shareLinkedin) shareLinkedin.href = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}`;

            // Copy to Clipboard Action
            const copyBtn = document.getElementById('share-copy');
            const copyToast = document.getElementById('copy-toast');
            if (copyBtn && copyToast) {
                copyBtn.addEventListener('click', () => {
                    navigator.clipboard.writeText(shareUrl).then(() => {
                        copyToast.classList.remove('opacity-0');
                        copyToast.classList.add('opacity-100');
                        setTimeout(() => {
                            copyToast.classList.remove('opacity-100');
                            copyToast.classList.add('opacity-0');
                        }, 2000);
                    }).catch(err => {
                        console.error('Failed to copy link: ', err);
                    });
                });
            }

            // Reading scroll progress bar logic
            window.addEventListener('scroll', () => {
                const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                if (height > 0) {
                    const scrolled = (winScroll / height) * 100;
                    const progressEl = document.getElementById('reading-progress');
                    if (progressEl) progressEl.style.width = scrolled + "%";
                }
            });

            // Populate Related Articles
            renderRelatedArticles(blogs, post);

            // Trigger lucide icon creation
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }

            // GSAP Entry Animation
            if (typeof gsap !== 'undefined') {
                gsap.from("#article-title", { y: 20, opacity: 0, duration: 0.8, ease: "power3.out" });
                gsap.from(".border-b", { y: 15, opacity: 0, duration: 0.8, delay: 0.2, ease: "power3.out" });
                gsap.from("#article-content", { y: 15, opacity: 0, duration: 0.8, delay: 0.4, ease: "power3.out" });
            }
        }

        function renderNotFound(message) {
            const viewEl = document.getElementById('main-article-view');
            if (viewEl) {
                viewEl.innerHTML = `
                    <div class="max-w-md mx-auto text-center py-20">
                        <div class="w-16 h-16 bg-canvas-soft text-ink rounded-full flex items-center justify-center mx-auto mb-6">
                            <i data-lucide="alert-triangle" class="w-8 h-8 text-ink-mute"></i>
                        </div>
                        <h2 class="text-2xl font-medium mb-2 text-ink">Article Not Found</h2>
                        <p class="text-ink-mute text-sm mb-8 leading-relaxed">${message}</p>
                        <a href="blog.html" class="btn-primary inline-flex items-center justify-center px-6 py-3 text-sm">
                            Back to Insights Blog
                        </a>
                    </div>
                `;
            }
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        function renderRelatedArticles(allBlogs, currentPost) {
            const relatedContainer = document.getElementById('related-grid');
            if (!relatedContainer) return;

            const filterList = allBlogs.filter(b => String(b.id) !== String(currentPost.id));

            // Select related posts (same category first, then fallback to others)
            let matchingCategory = filterList.filter(b => b.category === currentPost.category);
            let otherCategories = filterList.filter(b => b.category !== currentPost.category);

            let relatedBlogs = [...matchingCategory, ...otherCategories].slice(0, 3);

            if (relatedBlogs.length === 0) {
                relatedContainer.innerHTML = `
                    <div class="col-span-full text-center py-8 text-ink-mute text-sm font-light">
                        No other insights published yet.
                    </div>
                `;
            } else {
                relatedContainer.innerHTML = relatedBlogs.map(item => `
                    <a href="article.html?id=${item.id}" class="flex flex-col justify-between py-6 border-b border-hairline group">
                        <div>
                            <div class="flex justify-between items-center mb-4">
                                <span class="bg-canvas-soft border border-hairline text-ink text-[10px] font-medium px-3 py-1 rounded-full uppercase tracking-wider">${window.escapeHtml(item.category)}</span>
                                <div class="text-[10px] text-ink-mute font-medium">${window.escapeHtml(formatLocalShortDate(item.date))}</div>
                            </div>
                            <div class="space-y-2 mb-4">
                                <h3 class="display-md group-hover:text-ink-mute transition-colors line-clamp-2">${window.escapeHtml(item.title)}</h3>
                                <p class="text-sm text-ink-mute leading-relaxed line-clamp-3">${window.escapeHtml(item.summary || '')}</p>
                            </div>
                        </div>
                        <div class="flex justify-between items-center text-xs mt-2 text-ink-mute">
                            <span>By ${window.escapeHtml(item.author)}</span>
                            <span class="font-medium text-ink group-hover:underline">Read Article &rarr;</span>
                        </div>
                    </a>
                `).join('');
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadArticleDetail();
        });
    </script>
</body>
