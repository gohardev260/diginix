    <!-- Blog rendering script (PRESERVED — all dynamic JS intact) -->
    <script>
        let blogs = [];
        let activeCategory = 'All';
        let searchQuery = '';

        const grid = document.getElementById('blog-grid');
        const searchInput = document.getElementById('blog-search-input');
        const filterContainer = document.getElementById('blog-category-filter');

        function formatLocalShortDate(dateStr) {
            if (!dateStr) return 'N/A';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return String(dateStr).substring(0, 10);
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            } catch (e) {
                return String(dateStr).substring(0, 10);
            }
        }

        function renderCategoryFilters(allBlogs) {
            if (!filterContainer) return;
            
            const uniqueCategories = ['All', ...new Set(allBlogs.map(post => post.category).filter(Boolean))];
            
            filterContainer.innerHTML = uniqueCategories.map(cat => {
                const match = activeCategory === cat;
                return `
                    <button class="px-4 py-2 rounded-md text-sm font-medium transition-colors ${
                        match 
                            ? 'bg-canvas-soft border border-hairline text-ink' 
                            : 'bg-canvas border border-hairline text-ink-mute hover:text-ink hover:border-hairline-strong'
                    }" style="border-radius: 6px;" data-category="${window.escapeHtml(cat)}">
                        ${window.escapeHtml(cat === 'All' ? 'All Articles' : cat)}
                    </button>
                `;
            }).join('');

            filterContainer.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', async () => {
                    activeCategory = btn.getAttribute('data-category');
                    await renderBlogs();
                });
            });
        }

        async function renderBlogs() {
            if (!grid) return;
            
            blogs = await window.apiCall('get_blogs') || [];
            renderCategoryFilters(blogs);

            const filtered = blogs.filter(post => {
                const matchesCat = activeCategory === 'All' || post.category === activeCategory;
                const matchesSearch = post.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                     post.summary.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-20">
                        <i data-lucide="info" class="w-10 h-10 text-ink-faint mx-auto mb-4"></i>
                        <h2 class="heading-lg mb-2">No articles found</h2>
                        <p class="text-sm text-ink-mute">Try expanding your search query or switching categories.</p>
                    </div>
                `;
            } else {
                grid.innerHTML = filtered.map(post => `
                    <a href="article.html?id=${post.id}" class="flex flex-col justify-between py-6 border-b border-hairline group">
                        <div>
                            <div class="flex justify-between items-center mb-4">
                                <span class="bg-canvas-soft border border-hairline text-ink text-[10px] font-medium px-3 py-1 rounded-full uppercase tracking-wider">${window.escapeHtml(post.category)}</span>
                                <div class="text-[10px] text-ink-mute font-medium">${window.escapeHtml(formatLocalShortDate(post.date))}</div>
                            </div>
                            <div class="space-y-2 mb-4">
                                <h3 class="display-md group-hover:text-ink-mute transition-colors">${window.escapeHtml(post.title)}</h3>
                                <p class="text-sm text-ink-mute leading-relaxed line-clamp-3">${window.escapeHtml(post.summary)}</p>
                            </div>
                        </div>
                        <div class="flex justify-between items-center text-xs mt-2 text-ink-mute">
                            <span>By ${window.escapeHtml(post.author)}</span>
                            <span class="font-medium text-ink group-hover:underline">Read Article &rarr;</span>
                        </div>
                    </a>
                `).join('');
            }

            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        if (searchInput) {
            searchInput.addEventListener('input', async (e) => {
                searchQuery = e.target.value;
                await renderBlogs();
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await window.backendReady;
            await renderBlogs();
            window.addEventListener('storage', async () => {
                await renderBlogs();
            });
        });
    </script>
